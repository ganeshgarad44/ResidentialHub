<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Residential Hub — Hostels</title>
  <style>
    /* --- CSS STYLES (Standardized) --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      min-height: 100vh;
      background: #f5f7fb;
      color: #111;
      overflow-x: hidden;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #1f2b49 0%, #2d3a5e 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
      position: fixed;
      height: 100vh;
      left: 0; top: 0; z-index: 100;
    }
    .project-title {
      font-size: 22px; font-weight: 700; padding: 28px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.15); letter-spacing: 0.5px;
    }
    .nav-list { list-style: none; padding: 16px 0; margin: 0; flex-grow: 1; }
    .nav-list-item a {
      display: flex; align-items: center; gap: 12px; padding: 14px 24px;
      text-decoration: none; color: #d6dde6; transition: all 0.2s;
      font-size: 15px; border-left: 3px solid transparent;
    }
    .nav-list-item a:hover { background: rgba(47, 111, 237, 0.15); color: #fff; border-left-color: #2f6fed; }
    .nav-list-item.active a { background: rgba(47, 111, 237, 0.25); color: #fff; font-weight: 600; border-left-color: #2f6fed; }
    
    .user-profile {
      padding: 20px 24px; border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.15); display: flex; align-items: center; gap: 12px; margin-top: auto;
    }
    .user-profile-icon {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; flex-shrink: 0;
    }
    .user-profile-text p { margin: 0; font-size: 14px; color: #d6dde6; font-weight: 500; }
    .user-profile-text .muted-profile { font-size: 12px; color: #8892a6; }

    /* --- Main Content --- */
    .main-content {
      margin-left: 260px; flex-grow: 1; padding: 32px;
      max-width: calc(100vw - 260px); overflow-y: auto; height: 100vh;
    }
    .main-container {
      max-width: 1400px; margin: 0 auto; padding: 36px;
      background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(18, 38, 63, 0.08);
    }
    h1 { margin: 0 0 16px; font-size: 18px; color: #1f2b49; font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid #e8ecf2; }

    /* Context Header */
    #orgHeader {
      background: linear-gradient(135deg, #eef3ff 0%, #e0e7ff 100%);
      padding: 10px 14px; border-radius: 6px; margin-bottom: 20px;
      font-weight: 500; font-size: 13px; color: #1f2b49; border-left: 3px solid #667eea;
    }
    #orgHeader a { color: #667eea; text-decoration: none; font-weight: 600; }
    #orgHeader a:hover { text-decoration: underline; }

    h2 {
      margin: 24px 0 12px; font-size: 16px; color: #1f2b49; font-weight: 600;
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 8px; border-bottom: 1px solid #f0f3f7;
    }

    /* Buttons */
    button {
      padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.2s; font-family: inherit; white-space: nowrap;
    }
    button.primary { background: linear-gradient(135deg, #2f6fed 0%, #1e5dd8 100%); color: #fff; box-shadow: 0 2px 8px rgba(47, 111, 237, 0.3); }
    button.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(47, 111, 237, 0.4); }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    button.ghost { background: #f0f3f7; color: #1f2b49; }
    button.ghost:hover { background: #e2e8f0; }
    button.small { font-size: 13px; padding: 7px 14px; }

    /* Toolbar */
    .toolbar { display: flex; gap: 10px; align-items: center; }
    .search-wrapper {
      display: flex; align-items: center; gap: 6px; padding: 7px 12px;
      border: 1px solid #d6dde6; border-radius: 6px; background: #fff; transition: all 0.2s;
    }
    .search-wrapper:focus-within { border-color: #2f6fed; box-shadow: 0 0 0 2px rgba(47, 111, 237, 0.1); }
    .search-wrapper input { border: none; outline: none; padding: 0; font-size: 13px; width: 250px; background: transparent; }
    
    /* Messages */
    #msg { min-height: 5px; }
    .message {
      padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;
      font-size: 13px; font-weight: 500; animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 8px;
    }
    .success { background: #e6f6ea; color: #166534; border-left: 4px solid #38a169; }
    .error { background: #fff1f2; color: #9f1239; border-left: 4px solid #e53e3e; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* Modal */
    .modal {
      display: none; position: fixed; z-index: 1000; left: 0; top: 0;
      width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background-color: #fefefe; margin: auto; padding: 30px; border-radius: 12px;
      width: 90%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); position: relative;
    }
    .modal-content h3 { margin-top: 0; margin-bottom: 20px; font-size: 18px; border-bottom: 2px solid #e8ecf2; padding-bottom: 12px; color: #1f2b49; }
    .modal-close { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #aaa; }
    .modal-close:hover { color: #e53e3e; }
    
    .form-row { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 14px; }
    .form-row label { font-size: 14px; color: #1f2b49; font-weight: 500; margin-bottom: 6px; }
    .form-row input, .form-row select {
      width: 100%; padding: 8px 12px; border: 1px solid #d6dde6; border-radius: 6px;
      font-size: 14px; background: #fff; font-family: inherit;
    }
    .form-row input:focus, .form-row select:focus { outline: none; border-color: #2f6fed; box-shadow: 0 0 0 2px rgba(47, 111, 237, 0.1); }
    .form-row input[readonly] { background: #f0f3f7; color: #667085; cursor: not-allowed; }
    .button-row { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    /* Cards */
    #hostelCardsContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
    .hostel-card {
      padding: 16px; border: 1px solid #e8ecf2; border-left: 3px solid #667eea; /* Purple for hostels */
      border-radius: 8px; background: #fafbfc; position: relative; cursor: pointer; transition: all 0.25s;
    }
    .hostel-card:hover { transform: translateY(-4px); border-color: #667eea; background: #fff; box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15); }
    
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
    .card-icon {
      width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; flex-shrink: 0;
    }
    .delete-icon {
      width: 26px; height: 26px; background: #fff; border: 1px solid #fee; border-radius: 6px;
      color: #e53e3e; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .delete-icon:hover { background: #fee; border-color: #e53e3e; transform: scale(1.1); }
    
    .card-title { font-size: 15px; font-weight: 600; color: #1f2b49; margin-bottom: 6px; }
    .card-details { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
    .detail-row { display: flex; justify-content: space-between; font-size: 13px; }
    .detail-label { color: #667085; font-weight: 500; }
    .detail-value { color: #1f2b49; font-weight: 600; }
    
    .card-footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e8ecf2; font-size: 11px; color: #8892a6; font-family: 'Courier New', monospace; }
    
    /* Specific Hostel Badges */
    .card-type { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 6px; vertical-align: middle; }
    .type-boys { background: #dbeafe; color: #1e40af; }
    .type-girls { background: #fce7f3; color: #9f1239; }
    .type-mixed { background: #f3e8ff; color: #6b21a8; }

    .muted { color: #667085; font-size: 13px; }
    .empty-state { grid-column: 1 / -1; padding: 40px 20px; text-align: center; background: #fafbfc; border-radius: 8px; border: 2px dashed #e2e8f0; }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state h3 { font-size: 16px; color: #2d3748; margin-bottom: 6px; }

    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar { width: 220px; }
      .main-content { margin-left: 220px; max-width: calc(100vw - 220px); }
    }
    @media (max-width: 768px) {
      .sidebar { width: 70px; }
      .project-title, .user-profile-text, .nav-list-item a span:last-child { display: none; }
      .nav-list-item a { justify-content: center; padding: 14px; }
      .main-content { margin-left: 70px; max-width: calc(100vw - 70px); padding: 16px; }
      #hostelCardsContainer { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="project-title">🏢 Hostel Management</div>
	<ul class="nav-list">
	       <li class="nav-list-item">
	         <a href="organisation.html">
	           <span>🏛️</span>
	           <span>Organisation</span>
	         </a>
	       </li>
	       <li class="nav-list-item active">
	         <a href="hostel.html">
	           <span>🏠</span>
	           <span>Hostels</span>
	         </a>
	       </li>
	       <li class="nav-list-item">
	         <a href="buildings.html">
	           <span>🏢</span>
	           <span>Buildings</span>
	         </a>
	       </li>
	       <li class="nav-list-item">
	         <a href="floors.html">
	           <span>📊</span>
	           <span>Floors</span>
	         </a>
	       </li>
	       <li class="nav-list-item">
	         <a href="rooms.html">
	           <span>🛏️</span>
	           <span>Rooms</span>

	       <li class="nav-list-item">
	         <a href="beds.html">
	           <span>🛌</span>

    <div class="user-profile">
      <div class="user-profile-icon">👨‍💼</div>
      <div class="user-profile-text">
        <p>Admin User</p>
        <p class="muted-profile">View Profile</p>
      </div>

  <div class="main-content">
    <div class="main-container">
      <h1>Hostel Management</h1>

      <div id="orgHeader"></div>

      <div id="msg"></div>

      <h2>
        <span>All Hostels</span>
        <div class="toolbar">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input id="searchInput" type="text" placeholder="Search by name or address..." />

  <div id="addHostelModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" id="closeModalBtn">&times;</span>
      <h3>Add New Hostel</h3>
      <form id="hostelForm">

          <label for="hostelName">Hostel Name:</label>

		  <label>Area:</label>

<script>
// --- Configuration ---
const baseUrl = window.location.origin || 'http://localhost:8080';

const api = {
  list: async () => {
    try {
      const response = await fetch(baseUrl + '/hostels');
      if (!response.ok) throw new Error('Status: ' + response.status);
      return await response.json();
    } catch (e) {
      console.warn("Using mock data.", e);
      return []; // Fallback empty array
    }
  },
  add: async (obj) => {
    const response = await fetch(baseUrl + '/hostel', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(obj)
    });
    if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || 'Server Error');
    }
    const responseText = await response.text();
    // Specific error handling for Organisation check
    if (responseText.includes("No Organisation regarding :")) {
        throw new Error(`Invalid Organisation ID. ${responseText}`);
    }
    if (!responseText.includes("Hostel Saved")) { 
        throw new Error('Unexpected server response: ' + responseText);
    }
    return responseText;
  },
  delete: (id) => fetch(baseUrl + '/hostel/' + id, { method:'DELETE' }).then(r => {
      if(!r.ok) throw new Error('Status: ' + r.status);
      return r.text();
  })
};

// --- DOM Elements ---
const hostelForm = document.getElementById('hostelForm');
const msg = document.getElementById('msg');
const hostelCardsContainer = document.getElementById('hostelCardsContainer');
const searchInput = document.getElementById('searchInput');
const organisationIdInput = document.getElementById('organisationId');
const orgHeader = document.getElementById('orgHeader');
const addHostelModal = document.getElementById('addHostelModal');

// --- State ---
let currentOrganisationId = null;
let allHostels = [];

// --- Helper Functions ---
function getUrlParameter(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
}

function showMessage(text, type='success'){
  msg.innerHTML = `<div class="message ${type}">${type === 'success' ? '✅' : '❌'} ${text}</div>`;
  setTimeout(()=> msg.innerHTML='', 4000);
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getTypeClass(type) {
  const map = { 'Boys': 'type-boys', 'Girls': 'type-girls', 'Mixed': 'type-mixed' };
  return map[type] || 'type-mixed';
}

function getHostelIcon(type) {
  const map = { 'Boys': '👨', 'Girls': '👩', 'Mixed': '👥' };
  return map[type] || '🏠';
}

// --- Initialization ---
function initializePage() {
    currentOrganisationId = getUrlParameter('organisationId');
    
    if (currentOrganisationId) {
        orgHeader.innerHTML = `📍 Managing hostels for <strong>Organisation ID: ${currentOrganisationId}</strong> | <a href="organisation.html">Back to List</a>`;
    } else {
        orgHeader.innerHTML = `📍 Viewing <strong>All Hostels</strong>. Link an Organisation for better management.`;
    }
    
    loadHostels();
}

// --- Modal Logic ---
function openAddHostelModal() {
  if (currentOrganisationId) {
    organisationIdInput.value = currentOrganisationId;
    organisationIdInput.setAttribute('readonly', true);
  } else {
    organisationIdInput.value = '';
    organisationIdInput.removeAttribute('readonly');
  }
  addHostelModal.style.display = 'flex';
}

function closeAddHostelModal() {
  hostelForm.reset();
  addHostelModal.style.display = 'none';
}

// --- Data Loading & Rendering ---
async function loadHostels(){
  hostelCardsContainer.innerHTML = '<p class="muted">Loading hostels...</p>';
  try{
    const data = await api.list();
    allHostels = data || [];
    renderCards(allHostels);
  }catch(err){
    showMessage('Failed to load hostels: '+err.message,'error');
    hostelCardsContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <h3>Connection Error</h3>
        <p>Could not connect to the server.</p>
      </div>
    `;
  }
}

function renderCards(list){
  hostelCardsContainer.innerHTML = ''; 
  
  let displayList = list;
  if (currentOrganisationId) {
      displayList = list.filter(h => h.organisationId == currentOrganisationId);
  }
  
  if(!Array.isArray(displayList) || displayList.length===0){
    hostelCardsContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🛖</div>
        <h3>No hostels found</h3>
        <p>${currentOrganisationId ? `No hostels for Org ID: ${currentOrganisationId}` : 'Click "+ Add Hostel" to create your first one'}</p>
      </div>
    `;
    return;
  }
  
  // Search
  const q = (searchInput.value || '').toLowerCase();
  const filtered = displayList.filter(h => !q || 
    (h.hostelName && h.hostelName.toLowerCase().includes(q)) ||
    (h.address && h.address.toLowerCase().includes(q))
  );

  if (filtered.length === 0) {
    hostelCardsContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        <h3>No matches found</h3>
        <p>Try a different search term</p>
      </div>
    `;
    return;
  }
  
  filtered.forEach(h => {
    const card = document.createElement('div');
    card.className = 'hostel-card';
    card.dataset.hostelId = h.id; 
    
    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon">${getHostelIcon(h.type)}</div>
        <button class="delete-icon" data-hostel-id="${h.id}" title="Delete">
          ✕
        </button>
      </div>
      <h3 class="card-title">
        ${escapeHtml(h.hostelName ?? 'N/A')}
        <span class="card-type ${getTypeClass(h.type)}">${escapeHtml(h.type ?? '')}</span>
      </h3>
      <p style="font-size: 13px; color: #667085; margin-bottom: 8px;">
         📍 ${escapeHtml(h.address ?? 'N/A')}
      </p>
      <div class="card-details">
        <div class="detail-row">
          <span class="detail-label">Capacity:</span>
          <span class="detail-value">${h.capacity ?? 0}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Contact:</span>
          <span class="detail-value">${h.contactNo ?? 'N/A'}</span>
        </div>
      </div>
      <div class="card-footer">
        Org ID: ${h.organisationId ?? 'N/A'} | Hostel ID: ${h.id ?? 'N/A'}
      </div>
    `;

    // Click on card -> Go to Buildings
    card.addEventListener('click', (e) => {
        if(e.target.classList.contains('delete-icon') || e.target.closest('.delete-icon')) return; 
        window.location.href = 'buildings.html?hostelId=' + h.id;
    });

    // Delete Logic
    card.querySelector('.delete-icon').addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = e.currentTarget.dataset.hostelId;
      if(!confirm('Are you sure you want to delete this hostel? All associated buildings will be lost.')) return;
      
      try{
        await api.delete(id);
        showMessage('Hostel deleted successfully!');
        loadHostels();
      }catch(err){ 
          showMessage('Delete failed: '+err.message,'error'); 
      }
    });
    
    hostelCardsContainer.appendChild(card);
  });
}

// --- Event Listeners ---
hostelForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  
  const payload = { 
    hostelName: document.getElementById('hostelName').value.trim(),
    capacity: parseInt(document.getElementById('capacity').value, 10),
    contactNo: parseInt(document.getElementById('contactNo').value, 10),
    type: document.getElementById('type').value.trim(),
    image: document.getElementById('image').value.trim(),
    website: document.getElementById('website').value.trim(),
    organisationId: parseInt(organisationIdInput.value, 10),

    addressDto: {
      area: document.getElementById('area').value.trim(),
      city: document.getElementById('city').value.trim(),
      pin: parseInt(document.getElementById('pin').value, 10),
      state: document.getElementById('state').value.trim(),
      country: document.getElementById('country').value.trim()
    }
  };

  // validation
  if(
    !payload.hostelName ||
    !payload.addressDto.area ||
    !payload.addressDto.city ||
    isNaN(payload.addressDto.pin) ||
    !payload.addressDto.state ||
    !payload.addressDto.country ||
    isNaN(payload.capacity) ||
    isNaN(payload.organisationId)
  ){
    showMessage('Please fill all required fields correctly','error'); 
    return;
  }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Adding...';
  
  try{
    await api.add(payload);
    showMessage('Hostel added successfully!');
    closeAddHostelModal();
    loadHostels();
  }catch(err){ 
    showMessage('Save failed: '+err.message,'error'); 
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Add Hostel';
  }
});

// Toolbar & Modal actions
document.getElementById('addHostelBtn').addEventListener('click', openAddHostelModal);
document.getElementById('refreshBtn').addEventListener('click', loadHostels);
searchInput.addEventListener('input', () => renderCards(allHostels));
document.getElementById('closeModalBtn').addEventListener('click', closeAddHostelModal);
document.getElementById('cancelBtn').addEventListener('click', closeAddHostelModal);

window.onclick = function(event) {
  if (event.target == addHostelModal) closeAddHostelModal();
}

// Start
initializePage(); 
</script>
</body>
</html>
