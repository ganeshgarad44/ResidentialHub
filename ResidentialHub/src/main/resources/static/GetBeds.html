<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hostel Management — Vacant Beds</title>
  <style>
    /* Basic Layout and Utility Styles */
    body{font-family:Inter,Arial,Helvetica,sans-serif;margin:0;background:#f5f7fb;color:#111}
    .container{max-width:1200px;margin:36px auto;padding:18px;background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(18,38,63,0.08)}
    h1{margin:0 0 12px;font-size:22px;color:#1f2b49}
    
    /* Filtering and Search Area */
    #filterForm {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 25px;
        padding: 15px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fcfcfd;
    }
    #filterForm label {
        align-self: center;
        font-weight: 600;
        color: #4a5568;
    }
    #filterForm select, #filterForm input[type="number"] {
        padding: 10px;
        border: 1px solid #d6dde6;
        border-radius: 6px;
        min-width: 150px;
        flex-grow: 1;
        font-family: inherit;
    }
    button {
        padding: 10px 14px;
        border-radius: 6px;
        border: 0;
        cursor: pointer;
        white-space: nowrap;
        font-weight: 600;
        transition: all 0.2s;
    }
    button.primary {
        background:#2f6fed;
        color:#fff;
        flex-grow: 1;
    }
    button.primary:hover {
        opacity: 0.9;
    }
    button.secondary {
        background:#eef3ff;
        color:#1f2b49;
        flex-grow: 1;
    }
    button.secondary:hover {
        background: #e2e8f0;
    }

    /* Messaging */
    .muted{color:#667085;font-size:13px}
    .success{background:#e6f6ea;color:#166534;padding:10px 14px;border-radius:6px;margin-bottom:12px;border-left: 4px solid #38a169;}
    .error{background:#fff1f2;color:#9f1239;padding:10px 14px;border-radius:6px;margin-bottom:12px;border-left: 4px solid #e53e3e;}

    /* Bed Cards List Styling */
    #bedsCardsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px; 
      margin-top: 20px;
    }
    .bed-card {
      padding: 20px;
      border: 1px solid #d6dde6;
      border-left: 5px solid #059669; /* Green accent for Available Beds */
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(18,38,63,0.05);
      background: #fdfdfd;
      transition: transform 0.2s;
    }
    .bed-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(18,38,63,0.1);
    }
    .bed-card h3 {
      margin: 0 0 5px;
      font-size: 18px;
      color: #1f2b49; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #eef3ff;
    }
    .bed-card .price-tag {
        font-weight: bold;
        color: #059669;
        font-size: 16px;
    }
    .bed-card p {
      margin: 0;
      font-size: 14px;
      color: #667085;
      line-height: 1.5;
    }
    .location-info {
        background: #f0fdf4;
        padding: 10px;
        border-radius: 4px;
        margin-top: 10px;
        border: 1px dashed #a7f3d0;
    }
    .location-info strong {
        color: #059669;
        margin-right: 5px;
    }
    .location-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 4px;
    }
    .status-badge {
        font-size: 13px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 4px;
        color: #fff;
    }
    .status-Available { 
        background-color: #059669; 
        border: 1px solid #059669;
    }
    .status-Booked { 
        background-color: #ef4444; 
        border: 1px solid #ef4444;
        border-left: 5px solid #ef4444; 
    }
    .bed-card.status-Booked {
        border-left: 5px solid #ef4444; /* Red accent for Booked Beds */
    }

    /* Button Footer */
    .card-footer-buttons {
        margin-top: 15px;
        display: flex;
        gap: 10px;
    }
    .card-footer-buttons button {
        flex-grow: 1;
        font-size: 13px;
        padding: 8px 10px;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>🛏️ Vacant Bed Search</h1>
    <p class="muted" style="margin-bottom: 20px;">Find available or booked beds using capacity and status filters.</p>
    
    <div id="msg"></div>

    <form id="filterForm">
        <label for="statusFilter">Status:</label>
        <select id="statusFilter" required>
            <option value="" disabled>--Select Status--</option>
            <option value="Available" selected>Available</option>
            <option value="Booked">Booked</option>
        </select>

        <label for="sharingFilter">Sharing:</label>
        <select id="sharingFilter" required>
            <option value="" disabled selected>--Select Sharing--</option>
            <option value="1">1-Sharing</option>
            <option value="2">2-Sharing</option>
            <option value="3">3-Sharing</option>
            <option value="4">4-Sharing</option>
            <option value="6">6-Sharing</option>
        </select>
        
        <button id="searchBtn" class="primary" type="submit">Search Beds</button>
        <button id="resetBtn" class="secondary" type="button">Reset Filters</button>
    </form>

    <h2>Search Results</h2>
    
    <div id="bedsCardsContainer">
      <p class="muted">Use the filter options above to search for beds.</p>
    </div>

  </div>

<script>
const baseUrl = window.location.origin || 'http://localhost:8080';
const api = {
  // Assuming the backend endpoint is: /beds?status={status}&sharing={sharing}
  search: (status, sharing) => fetch(`${baseUrl}/beds?status=${status}&sharing=${sharing}`).then(r => {
      if (!r.ok) throw new Error('Status: ' + r.status);
      return r.json();
  }),
};

// DOM Element References
const filterForm = document.getElementById('filterForm');
const statusFilter = document.getElementById('statusFilter');
const sharingFilter = document.getElementById('sharingFilter');
const bedsCardsContainer = document.getElementById('bedsCardsContainer');
const msg = document.getElementById('msg');


/** Utility Functions **/
function showMessage(text, type='success'){
  msg.innerHTML = `<div class="${type==='success'?'success':'error'}">${type === 'success' ? '✅' : '❌'} ${text}</div>`;
  setTimeout(()=> msg.innerHTML='', 5000);
}

/** Data Loading and Rendering **/

async function searchBeds(e){
  // Prevent form default submission if triggered by button click
  if(e && e.preventDefault) e.preventDefault();
  
  const status = statusFilter.value;
  // Convert sharing to integer as API likely expects int, but keep as string if not set
  const sharing = sharingFilter.value ? parseInt(sharingFilter.value) : null; 

  if (!status || !sharing) {
      showMessage('Please select both Status and Sharing capacity to search.','error');
      return;
  }
  
  bedsCardsContainer.innerHTML = '<p class="muted">Searching...</p>';
  document.getElementById('searchBtn').disabled = true;
  document.getElementById('searchBtn').textContent = 'Searching...';


  try{
    // 1. Fetch data from the endpoint
    // Ensure the API call correctly formats the query parameters
    const data = await api.search(status, sharing);
    
    // 2. Render results
    renderCards(data || [], status, sharing);

  }catch(err){
    showMessage('Failed to fetch beds. Check server connection or endpoint structure. Error: '+err.message,'error');
    bedsCardsContainer.innerHTML = '<p class="muted">Failed to load results.</p>';
  } finally {
      document.getElementById('searchBtn').disabled = false;
      document.getElementById('searchBtn').textContent = 'Search Beds';
  }
}

function renderCards(list, status, sharing){
  bedsCardsContainer.innerHTML = ''; 
  
  if(!Array.isArray(list) || list.length===0){
    const statusText = status === 'Available' ? 'Available' : 'Booked';
    bedsCardsContainer.innerHTML = `<p class="muted">No ${statusText} beds found with ${sharing}-Sharing capacity matching the criteria.</p>`;
    return;
  }
  
  list.forEach(b => {
      const isAvailable = b.status.toLowerCase() === 'available';
      
      const card = document.createElement('div');
      card.className = `bed-card status-${isAvailable ? 'Available' : 'Booked'}`;
      
      const statusClass = `status-${b.status.replace(/[^a-zA-Z0-9]/g, '')}`; 
      
      // Card content based on the expected VacantBedSearchDto structure
      card.innerHTML = `
        <h3>
            Room ${b.roomNo ?? 'N/A'}, Bed ${b.bedNo ?? 'N/A'}
            <span class="status-badge ${statusClass}">${b.status}</span>
        </h3>
        <p class="price-tag">Price: ₹${b.price ?? 'N/A'}</p>
        
        <div class="location-info">
            <div class="location-row">
                <p><strong>Hostel:</strong> ${b.hostelName ?? 'N/A'}</p>
                <p><strong>Building:</strong> ${b.buildingName ?? 'N/A'}</p>
            </div>
            <div class="location-row">
                <p><strong>Floor:</strong> ${b.floorNo ?? 'N/A'}</p>
                <p><strong>Sharing:</strong> ${b.sharing ?? 'N/A'}</p>
            </div>
        </div>
        
        <div class="card-footer-buttons">
            <button class="${isAvailable ? 'primary' : 'secondary'}" 
                    onclick="alert('${isAvailable ? 'Action: Book Bed' : 'Action: View Tenant'} ${b.bedNo} in Room ${b.roomNo}')">
                ${isAvailable ? 'Book Now' : 'View Details'}
            </button>
            <button class="secondary" 
                    onclick="alert('Action: Edit Bed ${b.bedNo} details')">
                Edit
            </button>
        </div>
      `;

      bedsCardsContainer.appendChild(card);
  });
}

/** Event Listeners **/
filterForm.addEventListener('submit', searchBeds);

document.getElementById('resetBtn').addEventListener('click', () => {
    filterForm.reset();
    // Set 'Available' as the default selected status after reset
    statusFilter.value = 'Available'; 
    bedsCardsContainer.innerHTML = '<p class="muted">Use the filter options above to search for beds.</p>';
});

// Optional: Run initial search on load
// window.onload = () => {
//     // Ensure the sharing filter has a selected value if you want to run initial search
//     // sharingFilter.value = '2'; 
//     // searchBeds();
// };

</script>
</body>
</html>
