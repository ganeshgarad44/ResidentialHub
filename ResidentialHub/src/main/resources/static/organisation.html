<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Residential Hub — Organisation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      min-height: 100vh;
      background: #f5f7fb;
      color: #111;
      overflow-x: hidden;
    }

    /* --- Sidebar/Navigation --- */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #1f2b49 0%, #2d3a5e 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 0;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
      z-index: 100;
    }

    .project-title {
      font-size: 22px;
      font-weight: 700;
      padding: 28px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.15);
      letter-spacing: 0.5px;
    }

    .nav-list {
      list-style: none;
      padding: 16px 0;
      margin: 0;
      flex-grow: 1;
    }

    .nav-list-item a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      text-decoration: none;
      color: #d6dde6;
      transition: all 0.2s;
      font-size: 15px;
      border-left: 3px solid transparent;
    }

    .nav-list-item a:hover {
      background: rgba(47, 111, 237, 0.15);
      color: #fff;
      border-left-color: #2f6fed;
    }

    .nav-list-item.active a {
      background: rgba(47, 111, 237, 0.25);
      color: #fff;
      font-weight: 600;
      border-left-color: #2f6fed;
    }

    .user-profile {
      padding: 20px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: auto;
    }

    .user-profile-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .user-profile-text {
      flex-grow: 1;
    }

    .user-profile-text p {
      margin: 0;
      font-size: 14px;
      color: #d6dde6;
      font-weight: 500;
    }

    .user-profile-text .muted-profile {
      font-size: 12px;
      color: #8892a6;
    }

    /* --- Main Content --- */
    .main-content {
      margin-left: 260px;
      flex-grow: 1;
      padding: 32px;
      max-width: calc(100vw - 260px);
      overflow-y: auto;
      height: 100vh;
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 36px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(18, 38, 63, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 18px;
      color: #1f2b49;
      font-weight: 600;
      padding-bottom: 10px;
      border-bottom: 1px solid #e8ecf2;
    }

    h2 {
      margin: 24px 0 12px;
      font-size: 16px;
      color: #1f2b49;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid #f0f3f7;
    }

    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }

    button.primary {
      background: linear-gradient(135deg, #2f6fed 0%, #1e5dd8 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(47, 111, 237, 0.3);
    }

    button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(47, 111, 237, 0.4);
    }

    button.primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    button.ghost {
      background: #f0f3f7;
      color: #1f2b49;
    }

    button.ghost:hover {
      background: #e2e8f0;
    }

    button.small {
      font-size: 13px;
      padding: 7px 14px;
    }

    /* --- Toolbar --- */
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid #d6dde6;
      border-radius: 6px;
      background: #fff;
      transition: all 0.2s;
    }

    .search-wrapper:focus-within {
      border-color: #2f6fed;
      box-shadow: 0 0 0 2px rgba(47, 111, 237, 0.1);
    }

    .search-wrapper input {
      border: none;
      outline: none;
      padding: 0;
      font-size: 13px;
      width: 250px;
      background: transparent;
    }

    .search-icon {
      color: #8892a6;
      font-size: 14px;
    }

    /* --- Messages --- */
    .message {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
      animation: slideIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .success {
      background: #e6f6ea;
      color: #166534;
      border-left: 4px solid #38a169;
    }

    .error {
      background: #fff1f2;
      color: #9f1239;
      border-left: 4px solid #e53e3e;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- Modal Styles --- */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fefefe;
      margin: auto;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      position: relative;
    }

    .modal-content h3 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 18px;
      border-bottom: 2px solid #e8ecf2;
      padding-bottom: 12px;
      color: #1f2b49;
    }

    .modal-close {
      color: #aaa;
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      font-weight: bold;
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
    }

    .modal-close:hover {
      color: #e53e3e;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .form-row label {
      font-size: 14px;
      color: #1f2b49;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-row input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d6dde6;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.2s;
      background: #fff;
      font-family: inherit;
    }

    .form-row input:focus {
      outline: none;
      border-color: #2f6fed;
      box-shadow: 0 0 0 2px rgba(47, 111, 237, 0.1);
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    /* --- Cards Grid --- */
    #orgCardsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .org-card {
      padding: 16px;
      border: 1px solid #e8ecf2;
      border-radius: 8px;
      background: #fafbfc;
      position: relative;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .org-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
    }

    .org-card:hover {
      transform: translateY(-4px);
      border-color: #2f6fed;
      background: #fff;
      box-shadow: 0 8px 24px rgba(47, 111, 237, 0.15);
    }

    .org-card:hover::before {
      transform: scaleX(1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .delete-icon {
      width: 26px;
      height: 26px;
      background: #fff;
      border: 1px solid #fee;
      border-radius: 6px;
      color: #e53e3e;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.2s;
      z-index: 10;
    }

    .delete-icon:hover {
      background: #fee;
      border-color: #e53e3e;
      transform: scale(1.1);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #1f2b49;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #667085;
      margin-bottom: 4px;
    }

    .card-id {
      font-size: 11px;
      color: #8892a6;
      font-family: 'Courier New', monospace;
      background: #f0f3f7;
      padding: 3px 6px;
      border-radius: 3px;
      display: inline-block;
      margin-top: 8px;
    }

    .muted {
      color: #667085;
      font-size: 13px;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 40px 20px;
      text-align: center;
      background: #fafbfc;
      border-radius: 8px;
      border: 2px dashed #e2e8f0;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 16px;
      color: #2d3748;
      margin-bottom: 6px;
    }

    .empty-state p {
      color: #718096;
      font-size: 13px;
    }

    /* --- Responsive --- */
    @media (max-width: 1024px) {
      .sidebar {
        width: 220px;
      }
      
      .main-content {
        margin-left: 220px;
        max-width: calc(100vw - 220px);
      }

      h2 {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .toolbar {
        width: 100%;
      }

      .search-wrapper {
        flex: 1;
      }

      .search-wrapper input {
        width: 100%;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 70px;
      }
      
      .project-title,
      .user-profile-text,
      .nav-list-item a span:last-child {
        display: none;
      }
      
      .nav-list-item a {
        justify-content: center;
        padding: 14px;
      }
      
      .user-profile {
        justify-content: center;
        padding: 16px;
      }
      
      .main-content {
        margin-left: 70px;
        max-width: calc(100vw - 70px);
        padding: 16px;
      }
      
      .main-container {
        padding: 24px;
      }
      
      h1 {
        font-size: 16px;
      }
      
      #orgCardsContainer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="project-title">🏢 Hostel Management</div>
    <ul class="nav-list">
      <li class="nav-list-item active">
        <a href="organisation.html">
          <span>🏛️</span>
          <span>Organisation</span>
        </a>
      </li>
      <li class="nav-list-item">
        <a href="hostel.html">
          <span>🏠</span>
          <span>Hostels</span>
        </a>
      </li>
      <li class="nav-list-item">
        <a href="buildings.html">
          <span>🏢</span>
          <span>Buildings</span>
        </a>
      </li>
      <li class="nav-list-item">
        <a href="floors.html">
          <span>📊</span>
          <span>Floors</span>
        </a>
      </li>
      <li class="nav-list-item">
        <a href="rooms.html">
          <span>🛏️</span>
          <span>Rooms</span>
        </a>
      </li>
      <li class="nav-list-item">
        <a href="beds.html">
          <span>🛌</span>
          <span>Beds</span>
        </a>
      </li>
    </ul>
    
    <div class="user-profile">
      <div class="user-profile-icon">👤</div>
      <div class="user-profile-text">
        <p>Admin User</p>
        <p class="muted-profile">View Profile</p>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="main-container">
      <h1>Organisation Management</h1>

      <div id="msg"></div>

      <h2>
        <span>All Organisations</span>
        <div class="toolbar">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input id="searchInput" type="text" placeholder="Search by name or owner..." />
          </div>
          <button id="addOrgBtn" class="primary small">+ Add Organisation</button>
          <button id="refreshBtn" class="ghost small">Refresh</button>
        </div>
      </h2>

      <div id="orgCardsContainer">
        <p class="muted">Loading organisations...</p>
      </div>
    </div>
  </div>

  <!-- Add Organisation Modal -->
  <div id="addOrgModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" id="closeModalBtn">&times;</span>
      <h3>Add New Organisation</h3>
      <form id="orgForm">
        <div class="form-row">
          <label for="orgName">Organisation Name:</label>
          <input id="orgName" type="text" placeholder="Enter organisation name" required />
        </div>
        <div class="form-row">
          <label for="ownerName">Owner Name:</label>
          <input id="ownerName" type="text" placeholder="Enter owner name" required />
        </div>
        <div class="button-row">
          <button type="button" class="ghost" id="cancelBtn">Cancel</button>
          <button id="saveBtn" class="primary" type="submit">Add Organisation</button>
        </div>
      </form>
    </div>
  </div>

<script>
const baseUrl = window.location.origin || 'http://localhost:8080';

const api = {
  list: async () => {
    const response = await fetch(baseUrl + '/organisations');
    if (!response.ok) {
      throw new Error('Failed to fetch organisations: ' + response.status);
    }
    return await response.json();
  },
  add: async (obj) => {
    const response = await fetch(baseUrl + '/organisation', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(obj)
    });
    if (!response.ok) {
      throw new Error('Failed to add organisation: ' + response.status);
    }
    return await response.text();
  },
  delete: async (id) => {
    const response = await fetch(baseUrl + '/organisation/' + id, {
      method: 'DELETE'
    });
    if (!response.ok) {
      throw new Error('Failed to delete organisation: ' + response.status);
    }
    return await response.text();
  }
};

const orgForm = document.getElementById('orgForm');
const orgName = document.getElementById('orgName');
const ownerName = document.getElementById('ownerName');
const msg = document.getElementById('msg');
const orgCardsContainer = document.getElementById('orgCardsContainer');
const searchInput = document.getElementById('searchInput');
const addOrgModal = document.getElementById('addOrgModal');

let allOrganisations = [];

function showMessage(text, type = 'success') {
  msg.innerHTML = `<div class="message ${type}">${type === 'success' ? '✅' : '❌'} ${text}</div>`;
  setTimeout(() => msg.innerHTML = '', 4000);
}

function openAddOrgModal() {
  addOrgModal.style.display = 'flex';
}

function closeAddOrgModal() {
  orgForm.reset();
  addOrgModal.style.display = 'none';
}

async function loadOrganisations() {
  orgCardsContainer.innerHTML = '<p class="muted">Loading organisations...</p>';
  try {
    const data = await api.list();
    allOrganisations = data || [];
    renderCards(allOrganisations);
  } catch (err) {
    showMessage('Failed to load organisations: ' + err.message, 'error');
    orgCardsContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <h3>Connection Error</h3>
        <p>Could not connect to the server. Please check if the backend is running.</p>
      </div>
    `;
  }
}

function redirectToHostelPage(organisationId, organisationName) {
  const targetUrl = 'hostel.html?organisationId=' + organisationId;
  window.location.href = targetUrl;
}

function getInitials(name) {
  if (!name) return '?';
  const words = name.trim().split(' ');
  if (words.length >= 2) {
    return (words[0][0] + words[words.length - 1][0]).toUpperCase();
  }
  return name.substring(0, 2).toUpperCase();
}

function renderCards(list) {
  orgCardsContainer.innerHTML = '';
  
  if (!Array.isArray(list) || list.length === 0) {
    orgCardsContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📦</div>
        <h3>No organisations found</h3>
        <p>Click "+ Add Organisation" to create your first one</p>
      </div>
    `;
    return;
  }
  
  const q = (searchInput.value || '').toLowerCase();
  const filtered = list.filter(o => !q || 
    (o.organisationName && o.organisationName.toLowerCase().includes(q)) || 
    (o.ownerName && o.ownerName.toLowerCase().includes(q))
  );

  if (filtered.length === 0) {
    orgCardsContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        <h3>No matches found</h3>
        <p>Try a different search term</p>
      </div>
    `;
    return;
  }
  
  filtered.forEach(o => {
    const card = document.createElement('div');
    card.className = 'org-card';
    card.dataset.orgId = o.id;
    
    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon">${getInitials(o.organisationName)}</div>
        <button class="delete-icon" data-org-id="${o.id}" title="Delete">
          ✕
        </button>
      </div>
      <h3 class="card-title">${escapeHtml(o.organisationName ?? 'N/A')}</h3>
      <p class="card-subtitle">👤 Owner: ${escapeHtml(o.ownerName ?? 'N/A')}</p>
      <span class="card-id">ID: ${o.id ?? 'N/A'}</span>
    `;

    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-icon') || e.target.closest('.delete-icon')) return;
      redirectToHostelPage(o.id, o.organisationName);
    });

    card.querySelector('.delete-icon').addEventListener('click', async (e) => {
      e.stopPropagation();
      const orgId = e.currentTarget.dataset.orgId;
      
      if (!confirm('Are you sure you want to delete this organisation?')) return;
      
      try {
        await api.delete(orgId);
        showMessage('Organisation deleted successfully!');
        await loadOrganisations();
      } catch (err) { 
        showMessage('Delete failed: ' + err.message, 'error'); 
      }
    });
    
    orgCardsContainer.appendChild(card);
  });
}

function escapeHtml(s) { 
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); 
}

orgForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = { 
    organisationName: orgName.value.trim(), 
    ownerName: ownerName.value.trim() 
  };
  
  if (!payload.organisationName || !payload.ownerName) { 
    showMessage('Please fill in both fields', 'error'); 
    return; 
  }
  
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Adding...';

  try {
    await api.add(payload);
    showMessage('Organisation added successfully!');
    closeAddOrgModal();
    await loadOrganisations();
  } catch (err) { 
    showMessage('Save failed: ' + err.message, 'error'); 
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Add Organisation';
  }
});

document.getElementById('addOrgBtn').addEventListener('click', openAddOrgModal);
document.getElementById('closeModalBtn').addEventListener('click', closeAddOrgModal);
document.getElementById('cancelBtn').addEventListener('click', closeAddOrgModal);
document.getElementById('refreshBtn').addEventListener('click', loadOrganisations);
searchInput.addEventListener('input', () => renderCards(allOrganisations));

loadOrganisations();
</script>
</body>
</html>
