<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Residential Hub — Floors</title>
	<style>
		/* --- CSS STYLES (Standardized) --- */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			display: flex;
			min-height: 100vh;
			background: #f5f7fb;
			color: #111;
			overflow-x: hidden;
		}

		/* --- Sidebar/Navigation --- */
		.sidebar {
			width: 260px;
			background: linear-gradient(180deg, #1f2b49 0%, #2d3a5e 100%);
			color: #fff;
			display: flex;
			flex-direction: column;
			padding: 0;
			box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
			position: fixed;
			height: 100vh;
			left: 0;
			top: 0;
			z-index: 100;
		}

		.project-title {
			font-size: 22px;
			font-weight: 700;
			padding: 28px 24px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
			background: rgba(0, 0, 0, 0.15);
			letter-spacing: 0.5px;
		}

		.nav-list {
			list-style: none;
			padding: 16px 0;
			margin: 0;
			flex-grow: 1;
		}

		.nav-list-item a {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 14px 24px;
			text-decoration: none;
			color: #d6dde6;
			transition: all 0.2s;
			font-size: 15px;
			border-left: 3px solid transparent;
		}

		.nav-list-item a:hover {
			background: rgba(47, 111, 237, 0.15);
			color: #fff;
			border-left-color: #2f6fed;
		}

		.nav-list-item.active a {
			background: rgba(47, 111, 237, 0.25);
			color: #fff;
			font-weight: 600;
			border-left-color: #2f6fed;
		}

		.user-profile {
			padding: 20px 24px;
			border-top: 1px solid rgba(255, 255, 255, 0.1);
			background: rgba(0, 0, 0, 0.15);
			display: flex;
			align-items: center;
			gap: 12px;
			margin-top: auto;
		}

		.user-profile-icon {
			width: 42px;
			height: 42px;
			border-radius: 50%;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 18px;
			cursor: pointer;
			flex-shrink: 0;
		}

		.user-profile-text {
			flex-grow: 1;
		}

		.user-profile-text p {
			margin: 0;
			font-size: 14px;
			color: #d6dde6;
			font-weight: 500;
		}

		.user-profile-text .muted-profile {
			font-size: 12px;
			color: #8892a6;
		}

		/* --- Main Content --- */
		.main-content {
			margin-left: 260px;
			flex-grow: 1;
			padding: 32px;
			max-width: calc(100vw - 260px);
			overflow-y: auto;
			height: 100vh;
		}

		.main-container {
			max-width: 1400px;
			margin: 0 auto;
			padding: 36px;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 4px 20px rgba(18, 38, 63, 0.08);
		}

		h1 {
			margin: 0 0 16px;
			font-size: 18px;
			color: #1f2b49;
			font-weight: 600;
			padding-bottom: 10px;
			border-bottom: 1px solid #e8ecf2;
		}

		/* Building Header */
		#buildingHeader {
			background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
			padding: 10px 14px;
			border-radius: 6px;
			margin-bottom: 20px;
			font-weight: 500;
			font-size: 13px;
			color: #1f2b49;
			border-left: 3px solid #f97316;
		}

		#buildingHeader a {
			color: #f97316;
			text-decoration: none;
			font-weight: 600;
		}

		#buildingHeader a:hover {
			text-decoration: underline;
		}

		h2 {
			margin: 24px 0 12px;
			font-size: 16px;
			color: #1f2b49;
			font-weight: 600;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding-bottom: 8px;
			border-bottom: 1px solid #f0f3f7;
		}

		h2:first-of-type {
			margin-top: 0;
		}

		.section-divider {
			border: 0;
			border-top: 1px solid #e8ecf2;
			margin: 20px 0;
		}

		/* --- Form & Input Styles (For Modal) --- */
		.form-row {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			margin-bottom: 14px;
		}

		.form-row label {
			font-size: 14px;
			color: #1f2b49;
			font-weight: 500;
			margin-bottom: 6px;
		}

		.form-row input,
		.form-row select {
			width: 100%;
			padding: 8px 12px;
			border: 1px solid #d6dde6;
			border-radius: 6px;
			font-size: 14px;
			background: #fff;
			font-family: inherit;
		}

		.form-row input:focus,
		.form-row select:focus {
			outline: none;
			border-color: #2f6fed;
			box-shadow: 0 0 0 2px rgba(47, 111, 237, 0.1);
		}

		.form-row input[readonly] {
			background: #f0f3f7;
			color: #667085;
			cursor: not-allowed;
		}

		.button-row {
			display: flex;
			gap: 10px;
			margin-top: 20px;
			justify-content: flex-end;
		}

		/* --- Buttons --- */
		button {
			padding: 8px 16px;
			border-radius: 6px;
			border: none;
			cursor: pointer;
			font-size: 14px;
			font-weight: 600;
			transition: all 0.2s;
			font-family: inherit;
			white-space: nowrap;
		}

		button.primary {
			background: linear-gradient(135deg, #2f6fed 0%, #1e5dd8 100%);
			color: #fff;
			box-shadow: 0 2px 8px rgba(47, 111, 237, 0.3);
		}

		button.primary:hover {
			transform: translateY(-1px);
			box-shadow: 0 4px 12px rgba(47, 111, 237, 0.4);
		}

		button.primary:disabled {
			opacity: 0.6;
			cursor: not-allowed;
			transform: none;
		}

		button.ghost {
			background: #f0f3f7;
			color: #1f2b49;
		}

		button.ghost:hover {
			background: #e2e8f0;
		}

		button.small {
			font-size: 13px;
			padding: 7px 14px;
		}

		/* --- Modal Styles --- */
		.modal {
			display: none;
			position: fixed;
			z-index: 1000;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			overflow: auto;
			background-color: rgba(0, 0, 0, 0.5);
			justify-content: center;
			align-items: center;
		}

		.modal-content {
			background-color: #fefefe;
			margin: auto;
			padding: 30px;
			border-radius: 12px;
			width: 90%;
			max-width: 450px;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
			position: relative;
		}

		.modal-content h3 {
			margin-top: 0;
			margin-bottom: 20px;
			font-size: 18px;
			border-bottom: 2px solid #e8ecf2;
			padding-bottom: 12px;
			color: #1f2b49;
		}

		.modal-close {
			position: absolute;
			top: 15px;
			right: 20px;
			font-size: 28px;
			cursor: pointer;
			color: #aaa;
		}

		.modal-close:hover {
			color: #e53e3e;
		}


		/* --- Toolbar --- */
		.toolbar {
			display: flex;
			gap: 10px;
			align-items: center;
		}

		.search-wrapper {
			display: flex;
			align-items: center;
			gap: 6px;
			padding: 7px 12px;
			border: 1px solid #d6dde6;
			border-radius: 6px;
			background: #fff;
			transition: all 0.2s;
		}

		.search-wrapper:focus-within {
			border-color: #2f6fed;
			box-shadow: 0 0 0 2px rgba(47, 111, 237, 0.1);
		}

		.search-wrapper input {
			border: none;
			outline: none;
			padding: 0;
			font-size: 13px;
			width: 200px;
			/* Adjusted size for toolbar */
			background: transparent;
		}

		.search-icon {
			color: #8892a6;
			font-size: 14px;
		}

		/* --- Messages --- */
		.message {
			padding: 10px 14px;
			border-radius: 6px;
			margin-bottom: 16px;
			font-size: 13px;
			font-weight: 500;
			animation: slideIn 0.3s ease;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.success {
			background: #e6f6ea;
			color: #166534;
			border-left: 4px solid #38a169;
		}

		.error {
			background: #fff1f2;
			color: #9f1239;
			border-left: 4px solid #e53e3e;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(-10px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		/* --- Cards Grid --- */
		#floorCardsContainer {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
			gap: 16px;
			margin-top: 16px;
		}

		.floor-card {
			padding: 16px;
			border: 1px solid #e8ecf2;
			border-left: 3px solid #f97316;
			border-radius: 8px;
			background: #fafbfc;
			position: relative;
			cursor: pointer;
			transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
		}

		.floor-card:hover {
			transform: translateY(-4px);
			border-color: #f97316;
			background: #fff;
			box-shadow: 0 8px 24px rgba(249, 115, 22, 0.15);
		}

		.card-header {
			display: flex;
			justify-content: space-between;
			align-items: start;
			margin-bottom: 12px;
		}

		.card-icon {
			width: 36px;
			height: 36px;
			border-radius: 8px;
			background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;
			font-size: 18px;
			flex-shrink: 0;
		}

		.delete-icon {
			width: 26px;
			height: 26px;
			background: #fff;
			border: 1px solid #fee;
			border-radius: 6px;
			color: #e53e3e;
			font-weight: bold;
			cursor: pointer;
			font-size: 14px;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
			transition: all 0.2s;
			z-index: 10;
		}

		.delete-icon:hover {
			background: #fee;
			border-color: #e53e3e;
			transform: scale(1.1);
		}

		.card-title {
			font-size: 15px;
			font-weight: 600;
			color: #1f2b49;
			margin-bottom: 6px;
		}

		.card-details {
			margin-top: 10px;
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		.detail-row {
			display: flex;
			justify-content: space-between;
			font-size: 13px;
		}

		.detail-label {
			color: #667085;
			font-weight: 500;
		}

		.detail-value {
			color: #1f2b49;
			font-weight: 600;
		}

		.card-footer {
			margin-top: 12px;
			padding-top: 10px;
			border-top: 1px solid #e8ecf2;
			font-size: 11px;
			color: #8892a6;
			font-family: 'Courier New', monospace;
		}

		.muted {
			color: #667085;
			font-size: 13px;
		}

		.empty-state {
			grid-column: 1 / -1;
			padding: 40px 20px;
			text-align: center;
			background: #fafbfc;
			border-radius: 8px;
			border: 2px dashed #e2e8f0;
		}

		.empty-state-icon {
			font-size: 48px;
			margin-bottom: 12px;
			opacity: 0.5;
		}

		.empty-state h3 {
			font-size: 16px;
			color: #2d3748;
			margin-bottom: 6px;
		}

		.empty-state p {
			color: #718096;
			font-size: 13px;
		}

		/* --- Responsive --- */
		@media (max-width: 1024px) {
			.sidebar {
				width: 220px;
			}

			.main-content {
				margin-left: 220px;
				max-width: calc(100vw - 220px);
			}
		}

		@media (max-width: 768px) {
			.sidebar {
				width: 70px;
			}

			.project-title,
			.user-profile-text,
			.nav-list-item a span:last-child {
				display: none;
			}

			.nav-list-item a {
				justify-content: center;
				padding: 14px;
			}

			.user-profile {
				justify-content: center;
				padding: 16px;
			}

			.main-content {
				margin-left: 70px;
				max-width: calc(100vw - 70px);
				padding: 16px;
			}

			.main-container {
				padding: 24px;
			}

			h1 {
				font-size: 16px;
			}

			#floorCardsContainer {
				grid-template-columns: 1fr;
			}

			.form-row {
				flex-direction: column;
				align-items: flex-start;
				gap: 6px;
			}

			.form-row label {
				min-width: auto;
			}

			.button-row {
				margin-left: 0;
				width: 100%;
			}

			.button-row button {
				flex: 1;
			}

			h2 {
				flex-direction: column;
				align-items: flex-start;
				gap: 12px;
			}

			.toolbar {
				width: 100%;
				justify-content: space-between;
			}

			.search-wrapper {
				flex: 1;
			}

			.search-wrapper input {
				width: 100%;
			}
		}
	</style>
</head>

<body>
	<div class="sidebar">
		<div class="project-title">🏢 Hostel Management</div>
		<ul class="nav-list">
			<li class="nav-list-item">
				<a href="organisation.html">
					<span>🏛️</span>
					<span>Organisation</span>
				</a>
			</li>
			<li class="nav-list-item">
				<a href="hostel.html">
					<span>🏠</span>
					<span>Hostels</span>
				</a>
			</li>
			<li class="nav-list-item">
				<a href="buildings.html">
					<span>🏢</span>
					<span>Buildings</span>
				</a>
			</li>
			<li class="nav-list-item active">
				<a href="floors.html">
					<span>📊</span>
					<span>Floors</span>
				</a>
			</li>
			<li class="nav-list-item">
				<a href="rooms.html">
					<span>🛏️</span>
					<span>Rooms</span>
				</a>
			</li>
			<li class="nav-list-item">
				<a href="beds.html">
					<span>🛌</span>
					<span>Beds</span>
				</a>
			</li>
		</ul>

		<div class="user-profile">
			<div class="user-profile-icon">&#x1F464;</div>
			<div class="user-profile-text">
				<p>Admin User</p>
				<p class="muted-profile">View Profile</p>
			</div>
		</div>
	</div>

	<div class="main-content">
		<div class="main-container">
			<h1>Floor Management</h1>

			<div id="buildingHeader"></div>

			<div id="msg"></div>

			<h2>
				<span>All Floors</span>
				<div class="toolbar">
					<div class="search-wrapper">
						<span class="search-icon">&#x1F50D;</span>
						<input id="searchInput" type="text" placeholder="Search by floor number..." />
					</div>
					<button id="addFloorBtn" class="primary small">+ Add Floor</button>
					<button id="refreshBtn" class="ghost small">Refresh</button>
				</div>
			</h2>

			<div id="floorCardsContainer">
				<p class="muted">Loading floors...</p>
			</div>
		</div>
	</div>

	<div id="addFloorModal" class="modal">
		<div class="modal-content">
			<span class="modal-close" id="closeModalBtn">&times;</span>
			<h3>Add New Floor</h3>
			<form id="floorForm">
				<div class="form-row">
					<label for="floorNo">Floor Number:</label>
					<input id="floorNo" type="number" placeholder="e.g., 1, 2, 3" required />
				</div>
				<div class="form-row">
					<label for="noRooms">Number of Rooms:</label>
					<input id="noRooms" type="number" placeholder="Enter number of rooms" required />
				</div>
				<div class="form-row">
					<label for="buildingId">Building ID:</label>
					<input id="buildingId" type="number" placeholder="Auto-Set" required readonly />
				</div>
				<div class="button-row">
					<button type="button" class="ghost" id="cancelBtn">Cancel</button>
					<button id="saveBtn" class="primary" type="submit">Add Floor</button>
				</div>
			</form>
		</div>
	</div>
	<script>
		const baseUrl = window.location.origin || 'http://localhost:8080';

		// API Interface with Robust Error Handling
		const api = {
			list: async () => {
				try {
					const response = await fetch(baseUrl + '/floors');
					if (!response.ok) throw new Error('Status: ' + response.status);
					return await response.json();
				} catch (e) {
					console.error("Floor list fetch failed:", e);
					return [];
				}
			},
			add: async (obj) => {
				const response = await fetch(baseUrl + '/floor', {
					method: 'POST',
					headers: {'Content-Type': 'application/json'},
					body: JSON.stringify(obj)
				});
				const errorText = await response.text();
				if (!response.ok) {
					if (errorText.includes("No Building regarding")) {
						throw new Error(`Invalid Building ID: ${obj.buildingId}. Please ensure the building exists.`);
					}
					throw new Error(`Server Error (${response.status}): ${errorText || 'Failed to add floor.'}`);
				}
				return errorText;
			},
			delete: async (id) => {
				const response = await fetch(baseUrl + '/floors/' + id, {method: 'DELETE'});
				const responseText = await response.text();
				if (!response.ok) {
					throw new Error(`Delete failed: ${response.status}. ${responseText || ''}`);
				}
				return responseText;
			}
		};

		// --- DOM Elements & State ---
		const floorForm = document.getElementById('floorForm');
		const msg = document.getElementById('msg');
		const floorCardsContainer = document.getElementById('floorCardsContainer');
		const searchInput = document.getElementById('searchInput');
		const buildingIdInput = document.getElementById('buildingId');
		const buildingHeader = document.getElementById('buildingHeader');
		const addFloorModal = document.getElementById('addFloorModal'); // New Modal Element

		let currentBuildingId = null;

		// --- Helper Functions ---
		function getUrlParameter(name) {
			const urlParams = new URLSearchParams(window.location.search);
			return urlParams.get(name);
		}

		function showMessage(text, type = 'success') {
			msg.innerHTML = `<div class="message ${type}">${type === 'success' ? '✅' : '❌'} ${text}</div>`;
			setTimeout(() => msg.innerHTML = '', 4000);
		}

		function escapeHtml(s) {return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');}


		// --- Modal Logic ---
		function openAddFloorModal() {
			// Pre-fill and lock Building ID if available in URL
			if (currentBuildingId) {
				buildingIdInput.value = currentBuildingId;
				buildingIdInput.setAttribute('readonly', true);
			} else {
				buildingIdInput.value = '';
				buildingIdInput.removeAttribute('readonly');
			}
			addFloorModal.style.display = 'flex';
		}

		function closeAddFloorModal() {
			floorForm.reset();
			addFloorModal.style.display = 'none';
		}

		// --- Initialization ---
		function initializePage() {
			currentBuildingId = getUrlParameter('buildingId');

			if (currentBuildingId) {
				buildingIdInput.value = currentBuildingId;
				buildingIdInput.setAttribute('readonly', true);
				buildingHeader.innerHTML = `📍 Managing floors for <strong>Building ID: ${currentBuildingId}</strong>. <a href="buildings.html">Change Building</a>.`;
			} else {
				buildingHeader.innerHTML = `⚠️ <strong>Warning:</strong> No Building ID detected. Click "+ Add Floor" to enter manually or <a href="buildings.html">go back to Building List</a>.`;
				buildingIdInput.removeAttribute('readonly');
			}

			loadFloors();
		}

		// --- Data Loading & Rendering ---
		async function loadFloors() {
			floorCardsContainer.innerHTML = '<p class="muted">Loading floors...</p>';
			try {
				const data = await api.list();
				floorCardsContainer.dataset.fullList = JSON.stringify(data);
				renderCards(data || []);
			} catch (err) {
				showMessage('Failed to load floors: ' + err.message, 'error');
				floorCardsContainer.innerHTML = '<p class="muted">Failed to load data.</p>';
			}
		}

		function renderCards(list) {
			floorCardsContainer.innerHTML = '';

			let displayList = list;
			if (currentBuildingId) {
				displayList = list.filter(f => f.buildingId && String(f.buildingId) === currentBuildingId);
			}

			const q = (searchInput.value || '').toLowerCase();
			const filtered = displayList.filter(f => !q ||
				(f.floorNo && String(f.floorNo).includes(q)) ||
				(f.id && String(f.id).includes(q))
			);

			if (filtered.length === 0) {
				floorCardsContainer.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📊</div>
        <h3>No floors found</h3>
        <p>${currentBuildingId ? `No floors found for Building ID: ${currentBuildingId}. Click "+ Add Floor" to create one.` : 'Click "+ Add Floor" to create your first one'}</p>
      </div>
    `;
				return;
			}

			filtered.forEach(f => {
				const card = document.createElement('div');
				card.className = 'floor-card';
				card.dataset.floorId = f.id;

				const displayFloorNo = f.floorNo || f.floorNumber || 'N/A';

				card.innerHTML = `
      <div class="card-header">
        <div class="card-icon">&#x1F4CA;</div>
        <button class="delete-icon" onclick="delFloor(event, ${f.id})" title="Delete">
          ✕
        </button>
      </div>
      <h3 class="card-title">Floor ${displayFloorNo}</h3>
      <div class="card-details">
        <div class="detail-row">
          <span class="detail-label">Total Rooms:</span>
          <span class="detail-value">${f.noRooms ?? 'N/A'} rooms</span>
        </div>
      </div>
      <div class="card-footer">
        Floor ID: ${f.id ?? 'N/A'} | Building ID: ${f.buildingId ?? 'N/A'}
      </div>
    `;

				card.addEventListener('click', (e) => {
					if (e.target.classList.contains('delete-icon') || e.target.closest('.delete-icon')) return;
					window.location.href = 'rooms.html?floorId=' + f.id + '&buildingId=' + f.buildingId;
				});

				floorCardsContainer.appendChild(card);
			});
		}

		// --- Form Submission Logic ---
		floorForm.addEventListener('submit', async (e) => {
			e.preventDefault();

			const floorNo = parseInt(document.getElementById('floorNo').value, 10);
			const noRooms = parseInt(document.getElementById('noRooms').value, 10);
			const buildingId = parseInt(buildingIdInput.value, 10);

			// Validation
			if (isNaN(buildingId) || buildingId <= 0 || isNaN(floorNo) || isNaN(noRooms) || noRooms <= 0) {
				showMessage('Please ensure all fields are correctly filled and IDs are valid positive numbers.', 'error');
				return;
			}

			const payload = {
				floorNo: floorNo,
				noRooms: noRooms,
				buildingId: buildingId
			};

			const saveBtn = document.getElementById('saveBtn');
			saveBtn.disabled = true;
			saveBtn.textContent = 'Adding...';

			try {
				const res = await api.add(payload);
				showMessage(res || 'Floor added successfully!');
				closeAddFloorModal(); // Close on success
				loadFloors();
			} catch (err) {
				showMessage('Save failed: ' + err.message, 'error');
			} finally {
				saveBtn.disabled = false;
				saveBtn.textContent = 'Add Floor';
			}
		});

		// --- Toolbar & Modal Event Listeners ---
		document.getElementById('addFloorBtn').addEventListener('click', openAddFloorModal);
		document.getElementById('refreshBtn').addEventListener('click', loadFloors);
		document.getElementById('closeModalBtn').addEventListener('click', closeAddFloorModal);
		document.getElementById('cancelBtn').addEventListener('click', closeAddFloorModal);

		window.onclick = function (event) {
			if (event.target == addFloorModal) closeAddFloorModal();
		}

		searchInput.addEventListener('input', () => {
			const fullList = floorCardsContainer.dataset.fullList ? JSON.parse(floorCardsContainer.dataset.fullList) : [];
			renderCards(fullList);
		});

		window.delFloor = async function (event, id) {
			event.stopPropagation();

			if (!confirm('Are you sure you want to delete this floor? This will typically delete all associated rooms and beds!')) return;

			try {
				const res = await api.delete(id);
				showMessage(res || 'Floor deleted successfully!');
				loadFloors();
			} catch (err) {
				showMessage('Delete failed: ' + err.message, 'error');
			}
		}

		// Start Application
		initializePage(); 
	</script>
</body>

</html>
